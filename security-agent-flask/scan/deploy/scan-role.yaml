AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Role somente leitura para o posture scan. Não concede nenhuma permissão de
  escrita e não expõe conteúdo de objetos S3, itens de DynamoDB ou dados de banco.

Parameters:
  ScannerPrincipal:
    Type: String
    Description: ARN da conta ou role que vai assumir esta role (ex. arn:aws:iam::111122223333:root)
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Segredo compartilhado exigido no AssumeRole (protege contra confused deputy)
  RoleName:
    Type: String
    Default: PostureScanReadOnly
  MaxSessionSeconds:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 14400

Resources:
  ScanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: !Ref MaxSessionSeconds
      Description: Read-only posture scanning (security, reliability, cost)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ScannerPrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess
      Policies:
        - PolicyName: PostureScanExtras
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOnlyExtras
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - amplify:GetApp
                  - amplify:ListApps
                  - apigateway:GET
                  - appsync:GetGraphqlApi
                  - appsync:ListGraphqlApis
                  - athena:GetWorkGroup
                  - athena:ListWorkGroups
                  - autoscaling:DescribeAutoScalingGroups
                  - backup:DescribeBackupVault
                  - backup:ListBackupVaults
                  - bedrock:GetModelInvocationLoggingConfiguration
                  - budgets:ViewBudget
                  - ce:GetCostAndUsage
                  - cloudformation:DescribeStacks
                  - cloudfront:GetDistribution
                  - cloudfront:ListDistributions
                  - cloudtrail:GetTrail
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - codebuild:BatchGetProjects
                  - codebuild:ListProjects
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:ListUserPools
                  - docdb:DescribeDBClusters
                  - dynamodb:DescribeTable
                  - dynamodb:ListTables
                  - ec2:DescribeImages
                  - ec2:GetEbsEncryptionByDefault
                  - ecs:DescribeClusters
                  - ecs:ListClusters
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - elasticache:DescribeCacheClusters
                  - elasticache:DescribeReplicationGroups
                  - elasticbeanstalk:DescribeConfigurationSettings
                  - elasticbeanstalk:DescribeEnvironments
                  - elasticfilesystem:DescribeFileSystems
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticmapreduce:GetBlockPublicAccessConfiguration
                  - es:DescribeElasticsearchDomains
                  - es:ListDomainNames
                  - events:DescribeEventBus
                  - events:ListEventBuses
                  - globalaccelerator:DescribeAcceleratorAttributes
                  - globalaccelerator:ListAccelerators
                  - glue:GetDataCatalogEncryptionSettings
                  - iam:GetAccessKeyLastUsed
                  - iam:GetLoginProfile
                  - iam:GetPolicy
                  - iam:GetUser
                  - iam:ListAccessKeys
                  - iam:ListMFADevices
                  - iam:ListUsers
                  - kafka:DescribeClusterV2
                  - kafka:ListClustersV2
                  - kinesis:DescribeStreamSummary
                  - kinesis:ListStreams
                  - lambda:GetFunctionConfiguration
                  - logs:DescribeLogGroups
                  - macie2:GetMacieSession
                  - mq:DescribeBroker
                  - mq:ListBrokers
                  - organizations:DescribeOrganization
                  - pricing:GetProducts
                  - rds:DescribeDBClusters
                  - rds:DescribeDBClusterSnapshots
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - redshift:DescribeClusters
                  - route53:ListHostedZones
                  - route53:ListQueryLoggingConfigs
                  - s3:GetAccountPublicAccessBlock
                  - sagemaker:DescribeNotebookInstance
                  - sagemaker:ListNotebookInstances
                  - secretsmanager:DescribeSecret
                  - ses:GetIdentityDkimAttributes
                  - ses:ListIdentities
                  - sns:GetTopicAttributes
                  - sns:ListTopics
                  - sqs:GetQueueAttributes
                  - sqs:ListQueues
                  - ssm:GetDocument
                  - states:DescribeStateMachine
                  - states:ListStateMachines
                  - wafv2:GetLoggingConfiguration
                  - wafv2:ListWebACLs
                Resource: "*"
              - Sid: NeverReadObjectData
                Effect: Deny
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - kms:Decrypt
                Resource: "*"

Outputs:
  RoleArn:
    Description: Use este ARN em --role-arn
    Value: !GetAtt ScanRole.Arn
  ScanCommand:
    Value: !Sub "testcloud scan --role-arn ${ScanRole.Arn} --external-id <seu-external-id> --html relatorio.html"
